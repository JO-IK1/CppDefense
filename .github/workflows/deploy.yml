name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    # The production VPS runs Ubuntu 22.04. Build the native worker on the
    # same glibc/libstdc++ baseline so the uploaded binary remains compatible.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://cppdefense.jo-a1.ru
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test release validation and rollback
        run: python3 -m unittest discover -s deploy/tests -v

      - name: Set up Go for sandbox verification
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum

      - name: Build and verify sandbox before touching production
        env:
          CPPDEFENSE_TEST_SANDBOX_IMAGE: localhost/cppdefense-sandbox-candidate:release
          CPPDEFENSE_TEST_CONTAINER_RUNTIME: docker
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -f deploy/sandbox.Dockerfile \
            -t "$CPPDEFENSE_TEST_SANDBOX_IMAGE" deploy
          go -C backend test -race ./internal/runner \
            -run '^TestRealSandboxIncrementalSnapshotIsolation$' -count=1 -v
          docker image inspect --format '{{.Id}}' "$CPPDEFENSE_TEST_SANDBOX_IMAGE" \
            > deploy/.cppdefense-sandbox.image-id.new
          docker image save "$CPPDEFENSE_TEST_SANDBOX_IMAGE" | gzip -1 \
            > deploy/.cppdefense-sandbox.tar.gz.new
          sha256sum deploy/.cppdefense-sandbox.tar.gz.new | cut -d ' ' -f 1 \
            > deploy/.cppdefense-sandbox.sha256.new

      - name: Install GCC 12 and Podman archive verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-12 g++-12 podman

      - name: Verify Docker archive loads in Podman
        run: |
          set -euo pipefail
          expected_id=$(cat deploy/.cppdefense-sandbox.image-id.new)
          sudo podman load --input deploy/.cppdefense-sandbox.tar.gz.new
          loaded_id=$(sudo podman image inspect --format '{{.Id}}' "$expected_id")
          test "${loaded_id#sha256:}" = "${expected_id#sha256:}"
          sudo podman run --rm --pull never --network none "$expected_id" sh -lc \
            'command -v ninja && test -x /opt/cppdefense/timed.sh && find /usr/lib -name GTestConfig.cmake | grep -q .'

      - name: Build C++ worker
        run: |
          CC=gcc-12 CXX=g++-12 cmake \
            -S . \
            -B build-deploy-worker \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPP_DEFENSE_BUILD_WORKER=ON
          cmake \
            --build build-deploy-worker \
            --target cpp-defense-worker \
            --parallel 2
          test -x build-deploy-worker/cpp-defense-worker

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload C++ worker candidate
        run: |
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            build-deploy-worker/cpp-defense-worker \
            "$VPS_USER@$VPS_HOST:/opt/cppdefense/source/deploy/.cpp-defense-worker.new"

      - name: Upload verified sandbox archive
        run: |
          scp -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
            deploy/.cppdefense-sandbox.tar.gz.new \
            deploy/.cppdefense-sandbox.sha256.new \
            deploy/.cppdefense-sandbox.image-id.new \
            "$VPS_USER@$VPS_HOST:/opt/cppdefense/source/deploy/"

      - name: Update application on VPS
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -eu
          expected_sha=$1
          repository=/opt/cppdefense/source

          cd "$repository"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Deployment refused: tracked files on the VPS have local changes" >&2
            git status --short >&2
            exit 1
          fi

          git fetch --prune origin main
          test "$(git rev-parse origin/main)" = "$expected_sha"
          git checkout main
          git merge --ff-only "$expected_sha"
          ./deploy/deploy-app.sh
          REMOTE

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    env_file: ${CPPDEFENSE_ENV_FILE:-production.env}
    environment:
      POSTGRES_DB: cppdefense
      POSTGRES_USER: cppdefense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cppdefense -d cppdefense"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: ${CPPDEFENSE_ENV_FILE:-production.env}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${CPPDEFENSE_PRIVATE_BIND_IP}:9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  volume-helper:
    image: alpine:3.22.6
    profiles: ["maintenance"]
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - minio-data:/data
    security_opt: ["no-new-privileges:true"]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: ${CPPDEFENSE_ENV_FILE:-production.env}
    environment:
      CPPDEFENSE_HTTP_ADDRESS: 0.0.0.0:8080
      CPPDEFENSE_DATABASE_URL: postgres://cppdefense:${POSTGRES_PASSWORD}@postgres:5432/cppdefense?sslmode=disable
      CPPDEFENSE_STORAGE_MODE: s3
      CPPDEFENSE_STORAGE_S3_ENDPOINT: minio:9000
      CPPDEFENSE_STORAGE_S3_BUCKET: cppdefense
      CPPDEFENSE_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      CPPDEFENSE_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CPPDEFENSE_STORAGE_S3_SECURE: "false"
      CPPDEFENSE_STORAGE_SPOOL_DIR: /tmp
      CPPDEFENSE_AUTO_MIGRATE: "true"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports:
      - "${CPPDEFENSE_PRIVATE_BIND_IP}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=0700
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/cppdefense", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file: ${CPPDEFENSE_ENV_FILE:-production.env}
    depends_on:
      backend: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres-data:
  minio-data:

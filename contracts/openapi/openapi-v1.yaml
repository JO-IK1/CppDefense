      responses:
        '200':
          description: User activated and linked atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/pending-links/{user_id}/reject:
    post:
      tags: [Administration]
      operationId: rejectPendingStudentLink
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: Pending association rejected and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/users:
    get:
      tags: [Administration]
      operationId: listManagedUsers
      x-roles: [admin]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Users visible to the administrator
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedUser'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/users/{user_id}/role:
    put:
      tags: [Administration]
      operationId: setUserRole
      x-roles: [admin]
      security:
        - cookieAuth: []

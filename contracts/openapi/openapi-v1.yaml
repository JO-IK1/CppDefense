openapi: 3.1.0
info:
  title: CppDefense API
  version: 1.1.0
  summary: Public application and private runner contracts for CppDefense 2.1.0
  license:
    name: Proprietary source-available
servers:
  - url: https://cppdefense.jo-a1.ru
    description: Current small production deployment
tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Groups
  - name: Imports
  - name: Defenses
  - name: History
  - name: Administration
  - name: Runner
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        '204':
          description: Process is alive
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        '204':
          description: Required application dependencies are ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/github/start:
    get:
      tags: [Auth]
      operationId: startGithubLogin
      parameters:
        - $ref: '#/components/parameters/ReturnTo'
      responses:
        '302':
          description: Redirect to GitHub OAuth authorization endpoint
          headers:
            Location:
              schema:
                type: string
                format: uri
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/github/callback:
    get:
      tags: [Auth]
      operationId: completeGithubLogin
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 512
      responses:
        '302':
          description: Login completed; redirect to application or pending screen
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/groups:
    get:
      tags: [Groups]
      operationId: listGroups
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Groups visible to current user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Groups]
      operationId: createGroup
      x-roles: [admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code:
                  $ref: '#/components/schemas/Code'
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                is_demo:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/groups/{group_id}/labs:
    get:
      tags: [Groups]
      operationId: listGroupLabs
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Labs visible to current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lab'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Groups]
      operationId: createLab
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabRequest'
      responses:
        '201':
          description: Lab created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/groups/{group_id}/submissions:
    get:
      tags: [Groups]
      operationId: listGroupSubmissions
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Immutable submission versions in a managed group
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupSubmission'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/submissions/{submission_id}/archive:
    get:
      tags: [Groups]
      operationId: downloadSubmissionArchive
      security:
        - cookieAuth: []
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: ZIP visible to its student, assigned teacher, or administrator
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports:
    get:
      tags: [Imports]
      operationId: listPendingImports
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
      parameters:
        - name: group_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Imports waiting for teacher review
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Import' }
    post:
      tags: [Imports]
      operationId: createImport
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [group_id, kind, archive]
              properties:
                group_id:
                  $ref: '#/components/schemas/Uuid'
                kind:
                  enum: [group, lab]
                archive:
                  type: string
                  format: binary
      responses:
        '202':
          description: Upload accepted for validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/student/imports:
    post:
      tags: [Imports]
      operationId: createStudentImport
      x-roles: [student]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [archive]
              properties:
                archive: { type: string, format: binary }
      responses:
        '202':
          description: ZIP validated and queued for teacher review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/teacher/local-imports:
    post:
      tags: [Imports]
      operationId: prepareLocalImportCommand
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, labs, branch]
              properties:
                group_id: { $ref: '#/components/schemas/Uuid' }
                students: { type: array, items: { type: string } }
                labs: { type: array, minItems: 1, items: { type: string } }
                branch: { type: string, pattern: '^(latest|deadline_[0-9]+)$' }
                all_students: { type: boolean }
      responses:
        '201':
          description: A two-hour signed upload ticket for up to 200 selected works
          content:
            application/json:
              schema:
                type: object
                required: [ticket, count, expires_at]
                properties:
                  ticket: { type: string }
                  count: { type: integer }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/local-import/plan:
    get:
      tags: [Imports]
      operationId: readLocalImportPlan
      security:
        - localImportTicket: []
      responses:
        '200':
          description: Selected repository items and deadline policies for the local script
          content:
            application/json:
              schema: { type: object }
        '401': { description: Invalid or expired ticket }
  /api/v1/local-import/items/{item_id}/archive:
    post:
      tags: [Imports]
      operationId: uploadLocalImportArchive
      description: Revalidates current teacher permissions. Repeating the same ticket item returns the original import without creating a duplicate.
      security:
        - localImportTicket: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, branch, commit_sha]
              properties:
                archive: { type: string, format: binary }
                branch: { type: string, pattern: '^deadline_[0-9]+$' }
                commit_sha: { type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$' }
      responses:
        '202':
          description: Work is in the teacher approval queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  import_id: { $ref: '#/components/schemas/Uuid' }
                  state: { type: string }
        '401': { description: Invalid or expired ticket }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/teacher/github-imports/context:
    get:
      tags: [Imports]
      operationId: getTeacherGitHubImportContext
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Site groups, students, labs, and their GitHub organization used to derive expected repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubImportContext'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/teacher/github-imports:
    post:
      tags: [Imports]
      operationId: createTeacherGitHubImport
      x-roles: [teacher, admin]
      description: The teacher clones a repository locally and uploads its ZIP plus commit metadata. GitHub credentials are not part of this request. The backend checks site ownership; the claimed commit is not independently authenticated.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [group_id, group_code, github_login, lab_code, version_label, repository_full_name, commit_sha, archive]
              properties:
                group_id: { $ref: '#/components/schemas/Uuid' }
                group_code: { $ref: '#/components/schemas/Code' }
                github_login: { type: string }
                lab_code: { $ref: '#/components/schemas/Code' }
                version_label: { type: string, pattern: '^deadline_[0-9]+$' }
                repository_full_name: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
                commit_sha: { type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$' }
                archive: { type: string, format: binary }
      responses:
        '202':
          description: GitHub archive validated and queued for the normal teacher review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/imports/{import_id}:
    get:
      tags: [Imports]
      operationId: getImport
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import and preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports/{import_id}/review:
    post:
      tags: [Imports]
      operationId: reviewImport
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, archive_sha256, checklist]
              properties:
                decision:
                  enum: [approve, reject]
                archive_sha256:
                  $ref: '#/components/schemas/Sha256'
                checklist:
                  $ref: '#/components/schemas/ReviewChecklist'
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Review stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/imports/{import_id}/archive:
    get:
      tags: [Imports]
      operationId: downloadImportArchive
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Original or canonical ZIP visible to uploader and assigned staff
          content:
            application/zip:
              schema: { type: string, format: binary }
  /api/v1/imports/{import_id}/apply:
    post:
      tags: [Imports]
      operationId: applyImport
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Approved import application started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/defenses:
    post:
      tags: [Defenses]
      operationId: createDefense
      x-roles: [student]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [submission_version_id]
              properties:
                submission_version_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '202':
          description: Defense created and preparation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defense'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/defenses/{defense_id}:
    get:
      tags: [Defenses]
      operationId: getDefense
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/DefenseId'
      responses:
        '200':
          description: Defense visible to current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defense'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/defenses/{defense_id}/draft:
    put:
      tags: [Defenses]
      operationId: saveDefenseDraft
      x-roles: [student]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DefenseId'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"[0-9]+"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answer]
              properties:
                answer:
                  type: string
                  maxLength: 1048576
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, saved_at]
                properties:
                  version:
                    type: integer
                    minimum: 1
                  saved_at:
                    type: string
                    format: date-time
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/teacher/defenses/pending:
    get:
      tags: [Defenses]
      operationId: listDefensesPendingTeacherConfiguration
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Analyzed defenses waiting for teacher settings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Defense' }
  /api/v1/defenses/{defense_id}/configure:
    post:
      tags: [Defenses]
      operationId: configureDefense
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DefenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selection_mode, candidate_id, entity_mode, time_limit_seconds, wheel_size]
              properties:
                selection_mode: { enum: [automatic, manual] }
                candidate_id:
                  type: string
                  description: Empty for automatic mode; candidate UUID for manual mode
                entity_mode:
                  enum: [functions_only, functions_classes_structs]
                time_limit_seconds: { type: integer, minimum: 60, maximum: 1800 }
                wheel_size: { type: integer, minimum: 2, maximum: 12 }
      responses:
        '202':
          description: Teacher settings accepted and final preparation queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Defense' }
  /api/v1/defenses/{defense_id}/hide/configure:
    post:
      tags: [Defenses]
      operationId: configureHideSeekDefense
      x-roles: [teacher, admin]
      description: Validates original and mutated projects before starting the timer. Failed validation returns the defense to teacher configuration.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DefenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [time_limit_seconds, mutations]
              properties:
                time_limit_seconds: { type: integer, minimum: 60, maximum: 1800 }
                mutations:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { $ref: '#/components/schemas/HideMutation' }
      responses:
        '202':
          description: Validation queued; timer has not started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Defense' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/defenses/{defense_id}/repository:
    get:
      tags: [Defenses]
      operationId: listDefenseRepositoryFiles
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/DefenseId'
      responses:
        '200':
          description: Files in the defended submission
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [path, size]
                      properties:
                        path: { type: string }
                        size: { type: integer, minimum: 0 }
  /api/v1/defenses/{defense_id}/repository/file:
    get:
      tags: [Defenses]
      operationId: getDefenseRepositoryFile
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/DefenseId'
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: UTF-8 file; the selected function body is masked
          content:
            application/json:
              schema:
                type: object
                required: [path, content, masked]
                properties:
                  path: { type: string }
                  content: { type: string, maxLength: 2097152 }
                  masked: { type: boolean }
                  editable: { type: boolean, description: Whether this path can be edited in hide-and-seek mode }
  /api/v1/defenses/{defense_id}/attempts:
    post:
      tags: [Defenses]
      operationId: createCheckAttempt
      x-roles: [student]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DefenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answer]
              properties:
                answer:
                  type: string
                  maxLength: 1048576
      responses:
        '202':
          description: Attempt and job created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAttempt'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/defenses/{defense_id}/cancel:
    post:
      tags: [Defenses]
      operationId: cancelDefense
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DefenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Defense and outstanding jobs cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defense'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/attempts/{attempt_id}:
    get:
      tags: [Defenses]
      operationId: getCheckAttempt
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt visible under object policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAttempt'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/history/attempts:
    get:
      tags: [History]
      operationId: listAttemptHistory

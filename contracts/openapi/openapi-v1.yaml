        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/users/{user_id}/block:
    post:
      tags: [Administration]
      operationId: blockUser
      x-roles: [admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: User blocked and active sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/groups/{group_id}/teachers:
    post:
      tags: [Administration]
      operationId: assignTeacherToGroup
      x-roles: [admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Teacher assigned
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/rosters/preview:
    post:
      tags: [Administration]
      operationId: previewRosterImport
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RosterDocument' }
      responses:
        '200':
          description: Normalized roster changes without database mutation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterPreview' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/admin/rosters/apply:
    post:
      tags: [Administration]
      operationId: applyRosterImport
      x-roles: [teacher, admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RosterDocument' }
      responses:
        '200':
          description: Roster applied transactionally
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterPreview' }
  /api/v1/admin/view-as-role:
    put:
      tags: [Administration]
      operationId: setAdminViewAsRole
      x-roles: [admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewAsRoleRequest'
      responses:
        '200':
          description: Session presentation mode changed; real role remains admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Administration]
      operationId: clearAdminViewAsRole
      x-roles: [admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Session presentation mode reset to admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/runner/jobs/lease:
    post:
      tags: [Runner]
      operationId: leaseJob
      security:
        - runnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runner_id, capacity]
              properties:
                runner_id:
                  $ref: '#/components/schemas/Uuid'
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 6
      responses:
        '200':
          description: One job leased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLease'
        '204':
          description: No eligible job
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/runner/jobs/{job_id}/heartbeat:
    post:
      tags: [Runner]
      operationId: heartbeatJob
      security:
        - runnerBearer: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseToken'
      responses:
        '204':
          description: Lease extended
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/runner/jobs/{job_id}/complete:
    post:
      tags: [Runner]
      operationId: completeJob
      security:
        - runnerBearer: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteJobRequest'
      responses:
        '200':
          description: Current lease result accepted idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAttempt'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    localImportTicket:
      type: http
      scheme: bearer
      bearerFormat: signed-local-import-plan
    cookieAuth:
      type: apiKey
      in: cookie
      name: cppdefense_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    runnerBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    ReturnTo:
      name: return_to
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
        pattern: '^/(?!/).*$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ImportId:
      name: import_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DefenseId:
      name: defense_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LeaseToken:
      name: X-Lease-Token
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated principal is not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or hidden by object policy
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State, version or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Upload exceeds configured limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Syntactically valid request violates domain validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Required dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Upstream identity provider failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Code:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
    User:
      type: object
      additionalProperties: false
      required: [id, status, identities, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          enum: [pending, active, rejected, blocked]
        role:
          type: [string, 'null']
          enum: [student, teacher, admin, null]
        view_as:
          oneOf:
            - $ref: '#/components/schemas/ViewAsRole'
            - type: 'null'
          description: Presentation mode present only for a real admin; never grants authorization
        display_name:
          type: [string, 'null']
        identities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [provider, subject, verified_at]
            properties:
              provider:
                const: github
              subject:
                type: string
              login:
                type: [string, 'null']
              verified_at:
                type: string
                format: date-time
        created_at:
          type: string
          format: date-time
    ManagedUser:
      type: object
      additionalProperties: false
      required: [id, status, github_id, github_login, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          enum: [pending, active, rejected, blocked]
        role:
          type: [string, 'null']
          enum: [student, teacher, admin, null]
        display_name:
          type: [string, 'null']
        github_id:
          type: integer
          format: int64
        github_login:
          type: string
        created_at:
          type: string
          format: date-time
    ViewAsRoleRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [role]
          properties:
            role:
              const: admin
        - type: object
          additionalProperties: false
          required: [role, group_id]
          properties:
            role:
              const: teacher
            group_id:
              $ref: '#/components/schemas/Uuid'
        - type: object
          additionalProperties: false
          required: [role, student_record_id]
          properties:
            role:
              const: student
            student_record_id:
              $ref: '#/components/schemas/Uuid'
    ViewAsRole:
      type: object
      additionalProperties: false
      required: [role, read_only]
      properties:
        role:
          enum: [admin, teacher, student]
        group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        student_record_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        read_only:
          type: boolean
          description: False is permitted only for a target inside a demo group
    Group:
      type: object
      additionalProperties: false
      required: [id, code, name, status, is_demo]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/Code'
        name:
          type: string
        status:
          enum: [active, archived]
        is_demo:
          type: boolean
    CreateLabRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/Code'
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
    Lab:
      type: object
      additionalProperties: false
      required: [id, group_id, code, name, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        group_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/Code'
        name:
          type: string
        description:
          type: string
        status:
          enum: [active, archived]
    GroupSubmission:
      type: object
      additionalProperties: false
      required: [id, lab_id, lab_code, lab_name, version_number, version_label, source, defense_status, created_at, student_record_id, github_login]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        lab_id: { $ref: '#/components/schemas/Uuid' }
        lab_code: { $ref: '#/components/schemas/Code' }
        lab_name: { type: string }
        version_number: { type: integer, minimum: 1 }
        version_label: { type: string }
        source: { enum: [teacher_import, student_zip] }
        source_reference: { type: [string, 'null'] }
        commit_sha: { type: [string, 'null'] }
        approved_by: { type: [string, 'null'] }
        defense_status: { type: string }
        created_at: { type: string, format: date-time }
        student_record_id: { $ref: '#/components/schemas/Uuid' }
        github_login: { type: string }
    ReviewChecklist:
      type: object
      additionalProperties: false
      required: [paths_checked, ownership_checked]
      properties:
        paths_checked:
          const: true
        ownership_checked:
          const: true
    RosterDocument:
      type: object
      additionalProperties: false
      required: [schema_version, organization, groups]
      properties:
        schema_version: { const: 1 }
        organization:
          type: object
          additionalProperties: false
          required: [github_login, name]
          properties:
            github_login: { type: string }
            name: { type: string }
        groups:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, name, students]
            properties:
              code: { $ref: '#/components/schemas/Code' }
              name: { type: string }
              students:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [full_name, github_login]
                  properties:
                    full_name: { type: string }
                    github_login: { type: string }
    RosterPreview:
      type: object
      required: [organization, groups, summary]
      properties:
        organization: { type: object }
        groups:
          type: array
          items: { type: object }
        summary:
          type: object
          required: [groups_created, groups_updated, students_created, students_updated, unchanged]
          properties:
            groups_created: { type: integer, minimum: 0 }
            groups_updated: { type: integer, minimum: 0 }
            students_created: { type: integer, minimum: 0 }
            students_updated: { type: integer, minimum: 0 }
            unchanged: { type: integer, minimum: 0 }
    GitHubImportContext:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, code, name, organization_login, organization_name, students, labs]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              code: { $ref: '#/components/schemas/Code' }
              name: { type: string }
              organization_login: { type: string }
              organization_name: { type: string }
              students:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [github_login, full_name]
                  properties:
                    github_login: { type: string }
                    full_name: { type: string }
              labs:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [code, name]
                  properties:
                    code: { $ref: '#/components/schemas/Code' }
                    name: { type: string }
    ImportState:
      enum: [receiving, stored, validating, review_pending, approved, applying, completed, rejected, failed, cancelled]
    Import:
      type: object
      additionalProperties: false
      required: [id, group_id, kind, state, original_sha256, created_at, items]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        group_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          enum: [group, lab]
        state:
          $ref: '#/components/schemas/ImportState'
        original_sha256:
          $ref: '#/components/schemas/Sha256'
        original_filename:
          type: string
        reviewed_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reviewed_at:
          type: [string, 'null']
          format: date-time
        rejection_reason:
          type: [string, 'null']
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportItem'
        created_at:
          type: string
          format: date-time
    ImportItem:
      type: object
      additionalProperties: false
      required: [id, student_record_id, lab_id, github_login, project_path, action, file_count, uncompressed_size]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        student_record_id:
          $ref: '#/components/schemas/Uuid'
        lab_id:
          $ref: '#/components/schemas/Uuid'
        github_login:
          type: string
        project_path:
          type: string
        action:
          enum: [create_student_and_version, create_version, skip_duplicate, conflict]
        file_count:
          type: integer
          minimum: 0
        uncompressed_size:
          type: integer
          minimum: 0
        submission_version_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
    ValidationMessage:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        message:
          type: string
        path:
          type: [string, 'null']
    DefenseState:
      enum: [ready, preparing, active, passed, failed, expired, cancelled, error]
    Defense:
      type: object
      additionalProperties: false
      required: [id, session_id, submission_version_id, student_login, lab_code, lab_name, status, preparation_stage, seed, time_limit_seconds, wheel_size, entity_mode, selection_mode, current_draft, draft_version, wheel_candidates, created_at]
      properties:
        defense_mode: { enum: [restore, hide_seek] }
        error_count: { type: integer, minimum: 0, maximum: 5 }
        hide_report:
          description: Validation report with logs, returned only to teachers and administrators
          $ref: '#/components/schemas/HideValidation'
        preparation_error: { type: string }
        teacher_mutations:
          type: array
          description: Teacher-only configuration; absent from student responses
          maxItems: 5
          items: { $ref: '#/components/schemas/HideMutation' }
        id:
          $ref: '#/components/schemas/Uuid'
        session_id:
          $ref: '#/components/schemas/Uuid'
        submission_version_id:
          $ref: '#/components/schemas/Uuid'
        student_login: { type: string }
        lab_code: { type: string }
        lab_name: { type: string }
        status:
          $ref: '#/components/schemas/DefenseState'
        preparation_stage:
          enum: [analyzing_project, waiting_for_teacher, materializing_challenge, validating_hide_seek, ready, passed, failed, expired, cancelled, error]
        seed:
          type: string
          pattern: '^(0|[1-9][0-9]{0,19})$'
        time_limit_seconds:
          type: integer
          minimum: 1
        wheel_size:
          type: [integer, 'null']
          minimum: 2
          maximum: 12
        entity_mode:
          type: [string, 'null']
          enum: [functions_only, functions_classes_structs, null]
        selection_mode:
          type: [string, 'null']
          enum: [automatic, manual, null]
        deadline_at:
          type: [string, 'null']
          format: date-time
        challenge:
          oneOf:
            - $ref: '#/components/schemas/SelectedFunction'
            - type: 'null'
        current_draft:
          type: string
        draft_version:
          type: integer
          minimum: 1
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        selected_candidate_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        wheel_candidates:
          type: array
          items: { $ref: '#/components/schemas/WheelCandidate' }
        candidate_catalog:
          type: array
          description: Complete analyzed catalog returned only to teachers and administrators while configuration is pending
          items: { $ref: '#/components/schemas/WheelCandidate' }
        created_at:
          type: string
          format: date-time
    SelectedFunction:
      type: object
      additionalProperties: false
      required: [function_name, entity_type, file_path, signature, begin_line, end_line, masked_source]
      properties:
        function_name:
          type: string
        entity_type:
          enum: [function, class, struct]
        file_path:
          type: string
        signature:
          type: string
        begin_line:
          type: integer
          minimum: 1
        end_line:
          type: integer
          minimum: 1
        masked_source:
          type: string
          minLength: 1
          maxLength: 4194304
          description: Complete selected source file with only the chosen entity body removed
    WheelCandidate:
      type: object
      additionalProperties: false
      required: [id, rank, function_name, entity_type, is_test_file, signature, file_path, line_count, begin_line, end_line]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        rank: { type: integer, minimum: 1 }
        function_name: { type: string }
        entity_type: { enum: [function, class, struct] }
        is_test_file: { type: boolean }
        signature: { type: string }
        file_path: { type: string }
        line_count: { type: integer, minimum: 1 }
        begin_line: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
    AttemptOutcome:
      enum: [pending, passed, failed, error]
    StageResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          enum: [not_run, passed, failed, timed_out, error]
        exit_code:
          type: [integer, 'null']
        duration_ms:
          type: [integer, 'null']
          minimum: 0
    CheckAttempt:
      type: object
      additionalProperties: false
      required: [id, defense_id, attempt_no, outcome, accepted_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        defense_id:
          $ref: '#/components/schemas/Uuid'
        attempt_no:
          type: integer
          minimum: 1
        outcome:
          $ref: '#/components/schemas/AttemptOutcome'
        configure_result: {}
        build_result: {}
        ctest_result: {}
        accepted_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    JobLease:
      type: object
      additionalProperties: false
      required: [job_id, kind, defense_id, lease_token, lease_expires_at, session_id, submission_object_key, seed, top_n]
      properties:
        defense_mode: { enum: [restore, hide_seek] }
        hide_mutations:
          type: array
          maxItems: 5
          description: Private runner payload; never returned by the student defense endpoint
          items: { $ref: '#/components/schemas/HideMutation' }
        job_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          enum: [prepare_defense, check_attempt]
        defense_id:
          $ref: '#/components/schemas/Uuid'
        attempt_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        lease_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        lease_expires_at:
          type: string
          format: date-time
        session_id:
          $ref: '#/components/schemas/Uuid'
        submission_object_key:
          type: string
        seed:
          type: string
        top_n:
          type: integer
          minimum: 2
          maximum: 12
          deprecated: true
          description: Runner compatibility field carrying the configured wheel size
        selected_index:
          type: [integer, 'null']
          minimum: 0
          maximum: 9999
        answer:
          type: [string, 'null']
        selected_function:
          oneOf:
            - $ref: '#/components/schemas/WorkerSelectedFunction'
            - type: 'null'
    PrepareJobInput:
      type: object
      additionalProperties: false
      required: [kind, download_url, session_id, top_n, seed, worker_protocol]
      properties:
        kind:
          const: prepare_defense
        download_url:
          type: string
          format: uri
        session_id:
          $ref: '#/components/schemas/Uuid'
        top_n:
          type: integer
          minimum: 2
          maximum: 12
          deprecated: true
          description: Runner compatibility field carrying the configured wheel size
        seed:
          type: string
          pattern: '^(0|[1-9][0-9]{0,19})$'
        worker_protocol:
          const: '1.0'
    CheckJobInput:
      type: object
      additionalProperties: false
      required: [kind, download_url, session_id, answer, selected_function, worker_protocol]
      properties:
        kind:
          const: check_attempt
        download_url:
          type: string
          format: uri
        session_id:
          $ref: '#/components/schemas/Uuid'
        answer:
          type: string
          maxLength: 1048576
        selected_function:
          $ref: '#/components/schemas/WorkerSelectedFunction'
        worker_protocol:
          const: '1.0'
    WorkerSelectedFunction:
      type: object
      additionalProperties: false
      required: [function_name, entity_type, file_path, signature_begin, body_begin, body_end, source_sha256]
      properties:
        function_name:
          type: string
        entity_type:
          enum: [function, class, struct]
        file_path:
          type: string
        signature_begin:
          type: integer
          minimum: 0
        body_begin:
          type: integer
          minimum: 0
        body_end:
          type: integer
          minimum: 1
        source_sha256:
          $ref: '#/components/schemas/Sha256'
    CompleteJobRequest:
      type: object
      additionalProperties: false
      properties:
        hide_validation: { $ref: '#/components/schemas/HideValidation' }
        outcome:
          enum: [passed, failed, error, '']
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/PreparedCandidate'
        selected_index:
          type: integer
          minimum: 0
        masked_source:
          type: string
          maxLength: 4194304
          description: Empty after catalog analysis; populated after final challenge materialization
        configure_result: {}
        build_result: {}
        ctest_result: {}
    HideMutation:
      type: object
      additionalProperties: false
      required: [path, start, before, after]
      properties:
        path: { type: string }
        start: { type: integer, minimum: 0, description: Byte offset in original UTF-8 source }
        before: { type: string, minLength: 1, maxLength: 16384 }
        after: { type: string, maxLength: 16384 }
    HideValidation:
      type: object
      additionalProperties: false
      required: [valid, message]
      properties:
        valid: { type: boolean }
        message: { type: string }
        baseline: {}
        mutated: {}
        restored: {}
    PreparedCandidate:
      type: object
      additionalProperties: false
      required: [function_name, entity_type, is_test_file, file_path, signature, signature_begin, body_begin, body_end, begin_line, end_line, line_count, source_sha256, original_body_sha256]
      properties:
        function_name: { type: string }
        entity_type: { enum: [function, class, struct] }
        is_test_file: { type: boolean }
        file_path: { type: string }
        signature: { type: string }
        signature_begin: { type: integer, minimum: 0 }
        body_begin: { type: integer, minimum: 0 }
        body_end: { type: integer, minimum: 1 }
        begin_line: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
        line_count: { type: integer, minimum: 1 }
        source_sha256: { $ref: '#/components/schemas/Sha256' }
        original_body_sha256: { $ref: '#/components/schemas/Sha256' }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          $ref: '#/components/schemas/Uuid'
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string

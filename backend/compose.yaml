services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cppdefense
      POSTGRES_USER: cppdefense
      POSTGRES_PASSWORD: cppdefense-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cppdefense-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cppdefense -d cppdefense"]
      interval: 2s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cppdefense-local
      MINIO_ROOT_PASSWORD: cppdefense-local-secret-change-me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - cppdefense-minio:/data
    security_opt:
      - no-new-privileges:true

volumes:
  cppdefense-postgres:
  cppdefense-minio:

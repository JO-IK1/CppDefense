services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cppdefense
      POSTGRES_USER: cppdefense
      POSTGRES_PASSWORD: cppdefense-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cppdefense-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cppdefense -d cppdefense"]
      interval: 2s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  cppdefense-postgres:

